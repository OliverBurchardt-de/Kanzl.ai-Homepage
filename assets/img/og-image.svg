<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="kanzl.ai — KI, die in Ihrer Kanzlei ankommt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25282e"/>
      <stop offset="1" stop-color="#1b1e23"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#F7B234" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F7B234" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Wortmarke -->
  <g transform="translate(90 96)" font-family="Poppins, Montserrat, 'Segoe UI', sans-serif" font-weight="600" letter-spacing="-1">
    <text x="150" y="44" font-size="58" fill="#F5F4F0" text-anchor="end">kanzl</text>
    <circle cx="166" cy="35" r="8.5" fill="#F7B234"/>
    <text x="181" y="44" font-size="58" fill="#F5F4F0" text-anchor="start">ai</text>
  </g>

  <text x="90" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="500" fill="#f5f4f0">KI, die in Ihrer Kanzlei</text>
  <text x="90" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="500" font-style="italic" fill="#F7B234">ankommt.</text>

  <text x="90" y="500" font-family="Arial, sans-serif" font-size="30" fill="#aeb1b6">Für Steuer- &amp; Rechtsanwaltskanzleien · Schulung · Beratung · Workshops</text>

  <g font-family="'Courier New', monospace" font-size="22">
    <text x="90" y="566" fill="#F7B234">§ DSGVO-konform</text>
    <text x="360" y="566" fill="#aeb1b6">// von einem Steuerberater &amp; Wirtschaftsprüfer</text>
  </g>
</svg>
