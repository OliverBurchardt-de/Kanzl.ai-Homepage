    <path d="M43 20c-2-1.5-4.4-2.4-7-2.4-4.6 0-7.9 2.6-7.9 6.6 0 3.3 2.2 5.3 5.9 6.6M28 50c2 1.5 4.4 2.4 7 2.4 4.6 0 8-2.6 8-6.6 0-3.5-2.4-5.5-6.3-6.8M32.6 14v42M38.6 14v42" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
